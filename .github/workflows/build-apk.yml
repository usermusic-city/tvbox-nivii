name: Build Nivii APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build java flavor
        run: |
          chmod +x gradlew
          ./gradlew assembleJavaDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name "*.apk" -exec cp -v {} out/ \;
          ls -lh out/

      - name: Verify assets in APK
        run: |
          APK=$(find out -name "*.apk" | head -1)
          echo "校验 $APK"
          python3 - "$APK" <<'EOF'
          import sys, zipfile
          z = zipfile.ZipFile(sys.argv[1])
          n = z.namelist()
          meta = [x for x in n if x.startswith('assets/local-metadata/')]
          nivii = [x for x in n if x.startswith('assets/js/nivii/')]
          assert 'assets/nivii_local.json' in n, '缺 assets/nivii_local.json'
          assert len(meta) >= 6, f'local-metadata 仅 {len(meta)} 个'
          assert len(nivii) >= 6, f'js/nivii 仅 {len(nivii)} 个'
          print(f'assets 校验通过：总条目 {len(n)}，nivii {len(nivii)}，local-metadata {len(meta)}')
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-nivii-apk
          path: out/*.apk
          retention-days: 30
